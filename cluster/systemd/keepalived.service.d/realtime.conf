# /etc/systemd/system/keepalived.service.d/realtime.conf
# When GPU allocations run host RAM out, the reclaim stall delayed VRRP adverts past the 3 s
# master-down time, and the VIP moved back and forth with LiteLLM restarting behind it.
# Real-time scheduling keeps the adverts on time (keepalived 2.3 ignores vrrp_rt_priority here;
# keepalived.conf's vrrp_no_swap keeps it in RAM), and the OOM killer leaves it alone.
[Service]
CPUSchedulingPolicy=rr
CPUSchedulingPriority=50
OOMScoreAdjust=-900
