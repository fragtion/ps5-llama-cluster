# The PS5 NIC adds 0-10 ms of latency and drops packets on receive. Cubic halves its window on every
# drop; BBR doesn't, which took ps5b->ps5a from ~350 to ~750-890 Mbit/s (the pool's checkpoint copies).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# keep the window between requests instead of slow-starting each checkpoint copy again
net.ipv4.tcp_slow_start_after_idle = 0
