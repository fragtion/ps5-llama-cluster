# Ethernet and Wi-Fi sit in one subnet. By default Linux answers ARP for any local address on any
# interface ("ARP flux"), so the router learned the wrong MAC for an address and NetworkManager saw
# conflicts. Answer only on the interface that owns the address, and source ARP from it.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
