# /etc/systemd/system/ps5-stage-firmware.service.d/ordering.conf
#
# The linux-ps5 package's ps5-stage-firmware.service is pulled in by sysinit.target and ordered
# Before=systemd-modules-load.service, but keeps the default dependencies of a service, which
# order it After=sysinit.target and basic.target. That is an ordering cycle. At every boot systemd
# breaks it by deleting the start jobs of systemd-modules-load, and often systemd-sysctl and
# apparmor too (which ones varies per boot), so /etc/sysctl.d and /etc/modules-load.d are not
# applied and no AppArmor profiles are loaded.
#
# Make it an early-boot unit, like systemd-modules-load itself: it only needs /boot/efi mounted.
# Fixed upstream in ps5-linux/ps5-linux-image#49 (2026-11-08); images built before that, such as
# linux-ps5 7.1.7, still need this. It is harmless on a fixed image (same settings).
[Unit]
DefaultDependencies=no
After=local-fs.target
Before=sysinit.target systemd-modules-load.service network-pre.target
