# ps5_control --fan on hands the fan to the console's controller with a target temperature: fan
# control on kernel 7.1. From 7.3 the kernel drives the fan itself (hwmon ps5_fan, see ps5-fan), and
# the controller's servo pattern would only get in its way.
[Unit]
ConditionPathExists=/sys/devices/platform/ps5-fan/target_temp
