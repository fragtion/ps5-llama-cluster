# Pinned GPU memory can't be swapped, so running out makes the kernel thrash for minutes instead of
# killing anything. systemd-oomd kills this service once memory pressure stays high, and the kernel's
# OOM killer picks it before sshd or NetworkManager.
[Service]
OOMScoreAdjust=500
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
ManagedOOMMemoryPressureDurationSec=15s
